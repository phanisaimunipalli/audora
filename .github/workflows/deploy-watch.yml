# Tells whoever pushed that their commit broke the deploy, with the logs, so
# nobody finds out hours later by loading the site. Render's own notifications
# go to the Render team, which is not the same set of people as the ones
# pushing to this repo.
name: Deploy watch

on:
  push:
    branches: [main]

permissions:
  contents: write   # commit comments

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render, then report if it failed
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "RENDER_API_KEY not set; add it under Settings > Secrets. Skipping."
            exit 0
          fi
          API=https://api.render.com/v1
          auth=(-H "Authorization: Bearer $RENDER_API_KEY")

          # Render needs a moment to notice the push and create the deploy.
          deploy=""
          for i in $(seq 1 30); do
            deploy=$(curl -s "${auth[@]}" "$API/services/$RENDER_SERVICE_ID/deploys?limit=20" \
              | jq -r --arg sha "$SHA" '[.[].deploy | select(.commit.id == $sha)][0].id // empty')
            [ -n "$deploy" ] && break
            sleep 10
          done
          if [ -z "$deploy" ]; then
            echo "No Render deploy found for $SHA after 5 minutes. Auto-deploy may be off."
            exit 0
          fi
          echo "Watching deploy $deploy"

          # Poll to a terminal state. Builds here run about two minutes.
          status=""
          for i in $(seq 1 90); do
            status=$(curl -s "${auth[@]}" "$API/services/$RENDER_SERVICE_ID/deploys/$deploy" | jq -r '.status')
            case "$status" in
              live|deactivated) echo "Deploy $status. Nothing to report."; exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed) break ;;
            esac
            sleep 20
          done
          [ "$status" = "live" ] && exit 0

          echo "Deploy $status. Collecting logs."
          logs=$(curl -s -G "${auth[@]}" "$API/logs" \
            --data-urlencode "ownerId=$RENDER_OWNER_ID" \
            --data-urlencode "resource=$RENDER_SERVICE_ID" \
            --data-urlencode "limit=40" --data-urlencode "direction=backward" \
            | jq -r '(.logs // [])[] | "\(.timestamp[11:19]) \(.message)"' \
            | sed 's/\x1b\[[0-9;]*m//g' | tail -30)

          {
            echo "@$ACTOR this commit failed to deploy on Render."
            echo
            echo "**Status:** \`$status\`"
            echo "**Deploy:** https://dashboard.render.com/web/$RENDER_SERVICE_ID/deploys/$deploy"
            echo
            echo "<details><summary>Last 30 log lines</summary>"
            echo
            echo '```'
            echo "$logs"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "The previous deploy is still serving, so the site is up. It is running old code until this is fixed."
          } > body.md

          gh api "repos/$REPO/commits/$SHA/comments" -f body="$(cat body.md)" >/dev/null
          echo "Commented on $SHA."
          exit 1
